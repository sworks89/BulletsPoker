# icp-cli project (https://cli.internetcomputer.org).
# Local: `icp network start -d && icp deploy`. Mainnet: `icp deploy -e ic`.
# The local network already runs the ICP ledger (ryjl3-tyaaa-aaaaa-aaaba-cai, ICRC-2
# enabled) and seeds local identities with ICP; the backend defaults to that ledger.
# Sign-in uses mainnet Internet Identity (id.ai), which the local network trusts.
canisters:
  - name: poker_backend
    recipe:
      type: "@dfinity/rust@v3.3.0"
      configuration:
        candid: src/poker_backend/poker_backend.did
    settings:
      # Player alerts (src/poker_backend/src/alerts.rs): who delivers them, and the
      # address players' accounts belong to (CANISTER_ORIGIN in src/domains.ts). The
      # release script doesn't apply settings: see "Deploying to mainnet" in the README.
      environment_variables:
        notification_sender: "rdmx6-jaaaa-aaaaa-aaadq-cai"
        notification_origin: "https://byggy-dyaaa-aaaad-aha7q-cai.icp0.io"

  - name: poker_frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: src/poker_frontend/dist
        build:
          - npm --prefix src/poker_frontend ci
          - npm --prefix src/poker_frontend run build
