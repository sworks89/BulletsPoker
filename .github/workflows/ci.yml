name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown -p poker_backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/poker_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/poker_frontend/package-lock.json
      - run: npm ci
      - run: npm run build
