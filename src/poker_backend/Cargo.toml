[package]
name = "poker_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-timers = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
icrc-ledger-types = "0.1"
ic-stable-structures = "0.7.2"

[dev-dependencies]
candid_parser = "0.4.1"
pocket-ic = "16.1.0"
