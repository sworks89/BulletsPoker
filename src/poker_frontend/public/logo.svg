<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 0 178 120" role="img" aria-label="Bullets Poker logo">
  <title>Bullets Poker</title>
  <defs>
    <radialGradient id="brass" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fef3a0"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></radialGradient>
    <radialGradient id="copper" cx=".4" cy=".25" r=".8"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#9a3412"/></radialGradient>
    <radialGradient id="rim" cx=".4" cy=".2" r=".9"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#92400e"/></radialGradient>
    <linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <path id="shape" fill-rule="evenodd" d="M60 6C50 14 42 30 37 48L24 100H50L53 80H67L70 100H96L83 48C78 30 70 14 60 6ZM60 40 54 64H66Z"/>
    <clipPath id="clip"><use href="#shape" clip-rule="evenodd"/></clipPath>
    <g id="ace">
      <use href="#shape" fill="url(#brass)"/>
      <g clip-path="url(#clip)">
        <rect x="20" y="0" width="80" height="34" fill="url(#copper)"/>
        <rect x="20" y="66" width="80" height="4" fill="#92400e" opacity=".55"/>
        <rect x="20" y="91" width="80" height="4" fill="#92400e" opacity=".45"/>
        <path d="M30 32Q60 38 90 32" fill="none" stroke="#1b1b1b" stroke-width="2.5"/>
      </g>
      <path d="M53 14Q46 24 42 40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
      <path d="M38 56 31 88" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45"/>
      <use href="#shape" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
      <rect x="19" y="98" width="36" height="12" rx="3.5" fill="url(#rim)" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="65" y="98" width="36" height="12" rx="3.5" fill="url(#rim)" stroke="#1b1b1b" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    .shine { animation: shine 3.6s ease-in-out infinite; }
    .second { animation-delay: .3s; }
    @keyframes shine { 0%, 55% { transform: translateX(-90px); } 85%, 100% { transform: translateX(110px); } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3.6s ease-in-out infinite; }
    @keyframes spark { 0%, 62% { transform: scale(0); opacity: 0; } 74% { transform: scale(1) rotate(30deg); opacity: 1; } 90%, 100% { transform: scale(0) rotate(70deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .shine, .spark { animation: none; } .shine { opacity: 0; } .spark { opacity: 0; } }
  </style>
  <g transform="translate(0 0)">
    <use href="#ace"/>
    <g clip-path="url(#clip)"><rect class="shine" x="30" y="-10" width="34" height="140" fill="url(#band)"/></g>
  </g>
  <g transform="translate(84 0)">
    <use href="#ace"/>
    <g clip-path="url(#clip)"><rect class="shine second" x="30" y="-10" width="34" height="140" fill="url(#band)"/></g>
  </g>
  <path class="spark" transform="translate(176 24)" d="M0-9l2.6 6.4L9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6z" fill="#fff" stroke="#1b1b1b" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
